
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Calculator</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-color: white;
        }

        .calculator {
            max-width: 350px;
            background-color: black;
            padding: 20px;
            border-radius: 15px;
        }

        #display {
            height: 75px;
            font-size: 28px;
            text-align: right;
            margin-bottom: 20px;
            background-color: white;
            color: black;
        }

        .calc-btn {
            height: 60px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            border: 1px solid white;
        }

        .number {
            background-color: white;
            color: black;
        }

        .number:hover {
            background-color: #dddddd;
            color: black;
        }

        .operator {
            background-color: black;
            color: white;
        }

        .operator:hover {
            background-color: #333333;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container min-vh-100 d-flex
                justify-content-center align-items-center">

        <div class="calculator w-100">

            <h3 class="text-white text-center mb-4">
                Calculator
            </h3>

            <input type="text" id="display"
                   class="form-control"
                   placeholder="0" readonly>

            <div class="row g-2">

                <div class="col-3">
                    <button class="btn number w-100 calc-btn"
                            onclick="clearDisplay()">Clear</button>
                </div>

                <div class="col-3">
                    <button class="btn number w-100 calc-btn"
                            onclick="deleteNumber()">DEL</button>
                </div>

                <div class="col-3">
                    <button class="btn number w-100 calc-btn"
                            onclick="appendValue('%')">%</button>
                </div>

                <div class="col-3">
                    <button class="btn operator w-100 calc-btn"
                            onclick="appendValue('/')">÷</button>
                </div>

                <div class="col-3">
                    <button class="btn number w-100 calc-btn"
                            onclick="appendValue('7')">7</button>
                </div>

                <div class="col-3">
                    <button class="btn number w-100 calc-btn"
                            onclick="appendValue('8')">8</button>
                </div>

                <div class="col-3">
                    <button class="btn number w-100 calc-btn"
                            onclick="appendValue('9')">9</button>
                </div>

                <div class="col-3">
                    <button class="btn operator w-100 calc-btn"
                            onclick="appendValue('*')">×</button>
                </div>

                <div class="col-3">
                    <button class="btn number w-100 calc-btn"
                            onclick="appendValue('4')">4</button>
                </div>

                <div class="col-3">
                    <button class="btn number w-100 calc-btn"
                            onclick="appendValue('5')">5</button>
                </div>

                <div class="col-3">
                    <button class="btn number w-100 calc-btn"
                            onclick="appendValue('6')">6</button>
                </div>

                <div class="col-3">
                    <button class="btn operator w-100 calc-btn"
                            onclick="appendValue('-')">−</button>
                </div>

                <div class="col-3">
                    <button class="btn number w-100 calc-btn"
                            onclick="appendValue('1')">1</button>
                </div>

                <div class="col-3">
                    <button class="btn number w-100 calc-btn"
                            onclick="appendValue('2')">2</button>
                </div>

                <div class="col-3">
                    <button class="btn number w-100 calc-btn"
                            onclick="appendValue('3')">3</button>
                </div>

                <div class="col-3">
                    <button class="btn operator w-100 calc-btn"
                            onclick="appendValue('+')">+</button>
                </div>

                <div class="col-6">
                    <button class="btn number w-100 calc-btn"
                            onclick="appendValue('0')">0</button>
                </div>

                <div class="col-3">
                    <button class="btn number w-100 calc-btn"
                            onclick="appendValue('.')">.</button>
                </div>

                <div class="col-3">
                    <button class="btn operator w-100 calc-btn"
                            onclick="calculate()">=</button>
                </div>

            </div>
        </div>
    </div>

    <script>
        function appendValue(value) {
            document.getElementById("display").value += value;
        }

        function clearDisplay() {
            document.getElementById("display").value = "";
        }

        function deleteNumber() {
            var d = document.getElementById("display");
            d.value = d.value.slice(0, -1);
        }

        function calculate() {
            var d = document.getElementById("display");
            var a = d.value;

            try {
                if (a == "") {
                    return;
                }

                if (!/^[0-9+*/%.()-]+$/.test(a)) {
                    d.value = "Invalid";
                    return;
                }

                var result = Function("return (" + a + ")")();

                if (!Number.isFinite(result)) {
                    d.value = "Error";
                } else {
                    d.value = result;
                }
            }
            catch (error) {
                d.value = "Error";
            }
        }
    </script>

</body>
</html>
